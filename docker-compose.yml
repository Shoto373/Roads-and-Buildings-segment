version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aerial_segmentation_backend
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights:ro
      - ./outputs:/app/outputs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEVICE=cpu
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aerial_segmentation_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
